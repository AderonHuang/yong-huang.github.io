<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #eef1ee;
    color: #313b38;
    margin: 0;
    padding: 2em 1em;
  }
  .gallery-wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  .gallery-wrap a.back {
    display: inline-block;
    margin-bottom: 1.5em;
    color: #0e7c74;
    text-decoration: none;
    font-weight: 600;
  }
  .gallery-wrap a.back:hover { color: #0b625b; }
  .gallery-wrap h1 {

  }
  .gallery-wrap p.lead {
    color: #6a746f;
    margin: 0 0 2em;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.2em;
  }
  .gallery img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #dde5e1;
    background: #f8faf8;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .gallery img:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(30, 50, 45, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #e6e6e6; }
